{% extends 'tutorbase.html' %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/quizgenerator.css' %}">
{% endblock %}

{% block content %}
<div class="main-content">
    <div class="page-header">
        <h2>AI Quiz Generator</h2>
        <p>Create quiz questions instantly using AI</p>
    </div>

    <div class="quiz-stack">
        <!-- Top Section: Form -->
        <div class="card form-card">
            <div class="card-header">Quiz Topic</div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="form-group">
                        <input type="text" name="topic" placeholder="Enter topic (Eg: Python)" required>
                    </div>
                    <button type="submit" class="generate-btn">
                        Generate Quiz
                    </button>
                </form>
            </div>
        </div>

        <!-- Bottom Section: Results -->
        {% if quiz %}
        <div class="card result-card">
            <div class="card-header">Generated Quiz Result</div>
            <div class="card-body">
                <div class="quiz-content">
                    {{ quiz|linebreaks }}
                </div>
            </div>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
